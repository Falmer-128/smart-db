services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - ollama
    volumes:
      - anythingllm_storage:/app/server/storage
      - anythingllm_env:/app/server/.env
    environment:
      # Use the internal docker network to connect to Ollama
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_PATH=http://ollama:11434

volumes:
  ollama_data:
  anythingllm_storage:
  anythingllm_env:
