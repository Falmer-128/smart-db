version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-puller:
    image: curlimages/curl:latest
    container_name: ollama-puller
    depends_on:
      - ollama
    # Wait for Ollama to be available, then pull the model passed via the UI-generated .env
    entrypoint: ["sh", "-c"]
    command: 
      - |
        while ! curl -s http://ollama:11434 > /dev/null; do
          echo 'Waiting for Ollama to become ready...'
          sleep 2
        done
        echo 'Ollama is ready. Starting download for model: ${LLM_MODEL}'
        curl -s -X POST http://ollama:11434/api/pull -d '{"name":"${LLM_MODEL}"}'
        echo ""
        echo 'Model pull sequence completed successfully!'

  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - ollama
    volumes:
      - anythingllm_storage:/app/server/storage
      - anythingllm_env:/app/server/.env
    environment:
      # Use the internal docker network to connect to Ollama
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_PATH=http://ollama:11434

volumes:
  ollama_data:
  anythingllm_storage:
  anythingllm_env:
